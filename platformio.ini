; Wald Energy - ESP32-C3
; Source is expected in firmware/src. Add exact library dependencies
; only after the actual firmware source and its includes are imported.

[platformio]
src_dir = firmware/src
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
